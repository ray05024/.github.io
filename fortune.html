<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray & Yun 婚禮專屬幸運籤</title>
    
    <!-- 引入極具質感的宋體（襯線體） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 基礎全域重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #1a1a1a; /* 高級奢華深灰近黑背景 */
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        /* 主容器：限制最大寬度，完美適應所有手機螢幕 */
        .card-container {
            background-color: #fdfcf9; /* 溫潤的象牙白紙張感 */
            border: 1px solid #d4af37; /* 細緻燙金線條 */
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
            min-height: 480px; /* 給予基礎高度，但允許自動撐大 */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 歐式古典外框裝飾線 */
        .card-container::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid #eae1d4;
            border-radius: 8px;
            pointer-events: none;
        }

        /* 標題與副標 */
        .wedding-brand {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            color: #aa8c55;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        h1 {
            color: #222222;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #777777;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* 輸入區塊樣式 */
        .input-group {
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 280px;
            padding: 14px 20px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 1.05rem;
            text-align: center;
            outline: none;
            font-family: 'Noto Serif TC', serif;
            background-color: #ffffff;
            color: #222222;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #aa8c55;
            box-shadow: 0 0 10px rgba(170, 140, 85, 0.15);
        }

        /* 高級感感按鈕樣式 */
        .btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #aa8c55;
            padding: 14px 40px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Serif TC', serif;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
        }
        .btn:active {
            transform: scale(0.97);
            background-color: #333333;
        }

        /* ═══ ✨ 高級求籤特效區塊（慢速優化版） ✨ ═══ */
        .lottery-box {
            display: none;
            margin: 20px auto;
            position: relative;
            width: 160px;
            height: 220px;
            perspective: 1000px; /* 開啟3D空間感 */
        }
        
        /* 籤筒本體容器 */
        .cylinder-wrapper {
            width: 90px;
            height: 130px;
            position: absolute;
            bottom: 20px;
            left: 35px;
            transform-origin: bottom center;
        }
        
        /* 籤筒背板（讓籤看起來在筒子裡面） */
        .box-back {
            width: 100%;
            height: 100%;
            background: #151515;
            border-radius: 6px 6px 16px 16px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            border: 1px solid #55442b;
        }
        
        /* 籤筒面板（有燙金線條與奢華感） */
        .box-front {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            border: 2px solid #aa8c55;
            border-radius: 6px 6px 16px 16px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            box-shadow: inset 0 0 15px rgba(170,140,85,0.3), 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 籤筒上的古典燙金小裝飾 */
        .box-front::after {
            content: '囍';
            font-family: 'Noto Serif TC', serif;
            color: #aa8c55;
            font-size: 1.4rem;
            opacity: 0.8;
            letter-spacing: 0;
        }

        /* 籤支通用樣式 */
        .fortune-stick {
            width: 6px;
            height: 110px;
            background: linear-gradient(to bottom, #d4af37 0%, #aa8c55 100%);
            border-radius: 3px 3px 0 0;
            position: absolute;
            bottom: 40px;
            z-index: 2; /* 夾在前後板中間 */
            transform-origin: bottom center;
            box-shadow: 1px 0 3px rgba(0,0,0,0.3);
        }
        /* 籤支頂部的紅色硃砂漆效果，更有氛圍 */
        .fortune-stick::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: #932626;
            border-radius: 3px 3px 0 0;
        }

        /* 預設散落各角度的群籤 */
        .st-1 { left: 15px; transform: rotate(-12deg); }
        .st-2 { left: 30px; transform: rotate(-5deg); }
        .st-3 { left: 42px; transform: rotate(2deg); }
        .st-4 { left: 54px; transform: rotate(8deg); }
        .st-5 { left: 68px; transform: rotate(15deg); }

        /* 🔮 調整為節奏更穩重的籤筒搖晃動畫 */
        @keyframes containerShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-4px, 3px) rotate(-6deg); }
            30% { transform: translate(4px, -2px) rotate(5deg); }
            45% { transform: translate(-3px, -1px) rotate(-4deg); }
            60% { transform: translate(3px, 2px) rotate(4deg); }
            75% { transform: translate(-2px, 1px) rotate(-2deg); }
            90% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .animate-shake {
            animation: containerShake 0.5s infinite ease-in-out; /* 微調搖晃循環速度 */
        }

        /* 🎋 搖晃時群籤亂序彈跳動效 */
        @keyframes stickJumpingA {
            0%, 100% { bottom: 40px; } 50% { bottom: 62px; transform: rotate(-13deg); }
        }
        @keyframes stickJumpingB {
            0%, 100% { bottom: 40px; } 50% { bottom: 56px; transform: rotate(-4deg); }
        }
        @keyframes stickJumpingC {
            0%, 100% { bottom: 40px; } 50% { bottom: 65px; transform: rotate(4deg); }
        }
        @keyframes stickJumpingD {
            0%, 100% { bottom: 40px; } 50% { bottom: 60px; transform: rotate(11deg); }
        }
        
        .animate-shake .st-1 { animation: stickJumpingA 0.35s infinite ease-in-out; }
        .animate-shake .st-2 { animation: stickJumpingB 0.3s infinite ease-in-out 0.05s; }
        .animate-shake .st-3 { animation: stickJumpingC 0.33s infinite ease-in-out 0.02s; }
        .animate-shake .st-4 { animation: stickJumpingD 0.38s infinite ease-in-out 0.07s; }
        .animate-shake .st-5 { animation: stickJumpingB 0.32s infinite ease-in-out 0.04s; }

        /* 🎯 命定籤緩緩升起飛出動畫（放慢至 1.1 秒，優雅感倍增） */
        @keyframes stickRiseUp {
            0% { bottom: 40px; transform: scale(1) rotate(2deg); filter: brightness(1); }
            60% { bottom: 130px; transform: scale(1.1) rotate(0deg); filter: brightness(1.2); box-shadow: 0 0 12px rgba(212,175,55,0.5); }
            100% { bottom: 220px; transform: scale(1.25) translateY(-25px); opacity: 0; }
        }
        .stick-chosen {
            z-index: 4 !important; /* 歷史性的一刻，超越籤筒最前端 */
            animation: stickRiseUp 1.1s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }
        /* ═════════════════════════════════ */

        /* 最終籤詩結果 */
        .result-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfcf9;
            padding: 40px 24px;
            border-radius: 12px;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-y: auto;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 籤詩內文排版優化 */
        .result-content {
            width: 100%;
            margin-bottom: 24px;
        }
        .fortune-title {
            font-size: 2.2rem;
            color: #932626; /* 優雅的暗朱紅 */
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 20px;
            display: block;
        }
        .guest-name {
            font-size: 1.15rem;
            color: #222222;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 1px dashed #d1c7bd;
            padding-bottom: 8px;
            display: block;
            width: 100%;
        }
        .fortune-text {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #444444;
            white-space: pre-line; /* 完美保留換行 */
            text-align: left;
            padding: 0 4px;
            font-weight: 400;
        }
        
        .btn-retry {
            background-color: transparent;
            color: #aa8c55;
            border: 1px solid #aa8c55;
            margin-top: 10px;
        }
        .bless-footer {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: #b5a48c;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- 階段一：名字輸入介面 -->
        <div id="setup-view">
            <div class="wedding-brand">RAY & YUN WEDDING</div>
            <h1>婚禮專屬幸運籤</h1>
            <p class="subtitle">輸入您的姓名<br>擷取今日專屬於您的命定祝福</p>
            
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="請輸入姓名" maxlength="10">
            </div>
            
            <button class="btn" onclick="startLottery()">開啟祝福</button>
        </div>

        <!-- 階段二：高級感求籤動畫區塊 (慢速沉浸版) -->
        <div id="animation-view" class="lottery-box">
            <div class="cylinder-wrapper" id="boxElement">
                <!-- 後擋板 -->
                <div class="box-back"></div>
                
                <!-- 夾在中間的五根互動籤支 -->
                <div class="fortune-stick st-1"></div>
                <div class="fortune-stick st-2"></div>
                <div class="fortune-stick st-3" id="chosenStick"></div>
                <div class="fortune-stick st-4"></div>
                <div class="fortune-stick st-5"></div>
                
                <!-- 前面板 -->
                <div class="box-front"></div>
            </div>
        </div>

        <!-- 階段三：客製化大吉籤詩結果頁面 -->
        <div id="resultView" class="result-overlay">
            <div class="result-content">
                <span class="fortune-title" id="resultFortuneTitle">大吉</span>
                <span class="guest-name" id="resultName">致 賓客：</span>
                <p class="fortune-text" id="resultText">籤詩載入中...</p>
            </div>
            
            <div style="width: 100%;">
                <button class="btn btn-retry" onclick="resetLottery()">再抽一次</button>
                <div class="bless-footer">RAY & YUN 2027</div>
            </div>
        </div>
        
    </div>

    <script>
        // 🔮 1. 普卡庫：一般賓客隨機抽取的 100% 大吉資料庫
        const fortunePool = [
            "【今日運勢】大吉\n今日不宜幫新郎擋酒，新娘會生氣。適宜多吃兩道大菜，並把桌上的飲料喝光。遇到隔壁單身賓客請主動微笑！",
            "【今日運勢】大吉\n今天您在朋友圈的按讚數將會破紀錄！偷偷告訴你，今天靠近舞台的位置磁場最強，中獎機率直接飆升 200%！",
            "【今日運勢】大吉\n恭喜你抽到籤王！今天只要吃飽喝足，接下來一整年都會發大財。待會新郎敬酒時，記得給他一個最熱情的歡呼！",
            "【今日運勢】大吉\n今日福星高照！最適合做的事是找新郎新娘合照發限動。據說把今天的婚禮小物帶回家掛在鑰匙上，會幸運一整年！",
            "【今日運勢】大吉\n桃花運與財運雙雙爆棚！今天在宴席上會遇到生命中的貴人（也可能是多吃了一塊超好吃的主廚特製肉）。請盡情享受這完美的一天！"
        ];

        // 🎯 2. 隱藏版彩蛋對照表
        const specialFortunes = {
            "王小明": "【專屬祝福】王小明，好兄弟！\n感謝你從大學一路相挺到現在。今天不用幫我省錢，高粱給他喝下去就對了！待會敬酒這桌要給我最大聲喔！",
            "陳大美": "【專屬祝福】大美寶貝！\n看到妳今天盛裝出席真的太感動了。下一個換妳辦婚禮，我一定到！記得等一下去新娘房找我拿專屬探房禮物卡喔～",
            "Nicky": "【專屬祝福】Intel MSR 大師 Nicky！\n今日運勢直接突破天際！你的代碼將永遠沒有 Bug。今天好高興你能來參加 Ray & Yun 的婚禮，今天什麼都別管，盡情吃個痛快！",
            "林伴郎": "【專屬任務】大吉\n今天的紅包能不能順利送到新郎手上就看你了！今天的任務除了帥，還要負責幫新郎擋酒、遞衛生紙。你辛苦了，晚上留下來繼續喝！",
            "蔡沄諪": "【專屬任務】你是真的胖"
        };

        function startLottery() {
            const nameInput = document.getElementById('nameInput').value.trim();
            
            if (!nameInput) {
                alert('請先輸入您的姓名，才能開啟祝福唷。');
                return;
            }

            document.getElementById('setup-view').style.display = 'none';
            const animationView = document.getElementById('animation-view');
            animationView.style.display = 'block';
            
            const boxElement = document.getElementById('boxElement');
            const chosenStick = document.getElementById('chosenStick');
            
            // 步驟一：開始搖晃籤筒（延長到 2.2 秒）
            boxElement.classList.add('animate-shake');

            // 步驟二：第 2.2 秒，停止搖晃，中央的籤緩緩升起（升起動畫需 1.1 秒）
            setTimeout(() => {
                boxElement.classList.remove('animate-shake'); 
                chosenStick.classList.add('stick-chosen');    
            }, 2200);

            // 步驟三：第 3.5 秒（搖晃2.2s + 升起1.1s + 稍微定格期待0.2s），優雅切換到結果畫面
            setTimeout(() => {
                chosenStick.classList.remove('stick-chosen'); 
                animationView.style.display = 'none';
                showResult(nameInput);
            }, 3500);
        }

        function showResult(username) {
            let selectedText = "";
            let titleText = "大吉"; 

            if (specialFortunes.hasOwnProperty(username)) {
                selectedText = specialFortunes[username];
                titleText = "神籤"; 
            } else {
                const randomIndex = Math.floor(Math.random() * fortunePool.length);
                selectedText = fortunePool[randomIndex];
                titleText = "大吉";
            }

            document.getElementById('resultFortuneTitle').innerText = titleText;
            document.getElementById('resultName').innerText = `親愛的 ${username}：`;
            document.getElementById('resultText').innerText = selectedText;
            document.getElementById('resultView').style.display = 'flex';
        }

        function resetLottery() {
            document.getElementById('nameInput').value = '';
            document.getElementById('resultView').style.display = 'none';
            document.getElementById('setup-view').style.display = 'block';
        }
    </script>
</body>
</html>
